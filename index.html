<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESTEROS</title>
    <link rel="icon" id="siteFavicon" href="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes pageFadeIn {
            0% { opacity: 0; filter: blur(12px); transform: scale(1.05); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Inter', sans-serif; background-color: #030305; color: #ffffff;
            overflow: hidden; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            animation: pageFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0; animation: bgZoom 45s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
        }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.12); } }

        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 3, 5, 0.82); z-index: 1; pointer-events: none;
            transition: background 0.5s ease;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        .main-content {
            position: relative; z-index: 3; flex: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; gap: 32px; width: 100%;
        }

        /* กรอบวงกลมจำกัดขอบเขตไม่ให้โลโก้ล้นออกนอกวง (overflow: hidden) และอยู่นิ่งๆ */
        .emblem-container {
            position: relative; width: 180px; height: 180px;
            border-radius: 50%;
            overflow: hidden; /* ป้องกันไม่ให้โลโก้ล้นออกนอกวงกลม */
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 5px;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(5,5,10,0.9) 80%);
            border: 2px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.35), inset 0 0 25px rgba(212, 175, 55, 0.2);
        }

        .main-logo {
            width: 85%; height: 85%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8));
            z-index: 2;
            /* เอาอนิเมชั่นขยับออก ให้โลโก้อยู่นิ่งและอยู่ในวงกลมพอดี */
        }

        .header-section { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .main-title {
            font-family: 'Oswald', sans-serif; font-size: clamp(2.5rem, 5.8vw, 5rem);
            letter-spacing: 0.25em; margin: 0; font-weight: 700; text-transform: uppercase; color: #ffffff;
            text-shadow: 0 0 45px rgba(255, 255, 255, 0.35), 0 5px 25px rgba(0, 0, 0, 0.95);
        }

        .gold-divider {
            display: flex; align-items: center; gap: 16px; color: #d4af37;
            font-size: 0.68rem; letter-spacing: 0.4em; text-transform: uppercase; font-weight: 600; opacity: 0.95;
        }
        .gold-divider::before, .gold-divider::after {
            content: ''; width: 90px; height: 1.5px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }

        .btn-members {
            margin-top: 15px; text-decoration: none; background: rgba(14, 14, 22, 0.85);
            border: 1.5px solid rgba(212, 175, 55, 0.45); border-radius: 40px; padding: 16px 48px;
            color: #ffffff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.88rem;
            text-transform: uppercase; letter-spacing: 0.35em; display: flex; align-items: center; gap: 18px;
            backdrop-filter: blur(15px); box-shadow: 0 15px 45px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.25);
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; z-index: 10;
        }
        .btn-members:hover {
            background: rgba(28, 24, 45, 0.95); border-color: #d4af37;
            box-shadow: 0 20px 70px rgba(0,0,0,0.95), 0 0 50px rgba(212, 175, 55, 0.65);
            transform: translateY(-6px) scale(1.06); color: #d4af37;
        }

        .music-widget {
            position: fixed; bottom: 25px; right: 25px; background: rgba(10, 10, 15, 0.88);
            backdrop-filter: blur(25px); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 14px;
            width: 280px; z-index: 99999; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .music-widget.collapsed { height: 60px; }
        .music-widget.expanded { height: 115px; }
        .music-header { display: flex; align-items: center; padding: 9px 12px; height: 60px; box-sizing: border-box; cursor: pointer; }
        .cover-wrapper { position: relative; width: 36px; height: 36px; margin-right: 10px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 1.5px solid rgba(212, 175, 55, 0.6); animation: spinRecord 5s linear infinite; animation-play-state: paused;
        }
        .playing .music-cover { animation-play-state: running; border-color: #d4af37; box-shadow: 0 0 10px #d4af37; }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.42rem; color: #d4af37; letter-spacing: 0.2em; font-weight: 700; }
        .music-title { font-family: 'Oswald', sans-serif; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .music-link { font-size: 0.45rem; color: #888; text-decoration: none; }
        .toggle-icon { font-size: 0.5rem; color: #d4af37; padding: 4px; transition: 0.5s; }
        .music-controls { display: flex; align-items: center; padding: 0 14px 12px 14px; gap: 12px; opacity: 0; transition: opacity 0.4s; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.4); }
        .music-widget.expanded .music-controls { opacity: 1; }
        .ctrl-btn { background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.4); color: #d4af37; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); padding: 3px 8px; border-radius: 6px; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 3px; background: rgba(255,255,255,0.2); outline: none; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; background: #d4af37; cursor: pointer; }

        .footer-credit {
            position: relative; z-index: 3; width: 100%; text-align: center; padding: 20px 0;
            font-size: 0.55rem; color: #777; letter-spacing: 0.35em; text-transform: uppercase; font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <canvas id="particleCanvas"></canvas>

    <main class="main-content">
        <!-- โลโก้อยู่ในวงกลมพรีเมียม และถูกจำกัดพื้นที่ไม่ให้ล้นออกนอกวง -->
        <div class="emblem-container">
            <img id="mainLogo" src="" alt="Logo" class="main-logo" style="display: none;">
        </div>

        <header class="header-section">
            <h1 id="dynMainTitle" class="main-title">WESTEROS</h1>
            <div class="gold-divider">
                <span>●</span>
                <span id="dynSubTitle">WESTEROS</span>
                <span>●</span>
            </div>
        </header>
        
        <a href="member.html" class="btn-members">
            <span>MEMBERS</span>
            <span>›</span>
        </a>
    </main>

    <div id="musicWidget" class="music-widget collapsed">
        <div class="music-header" id="toggleMusicBtn">
            <div class="cover-wrapper">
                <img id="musicCover" class="music-cover" src="https://placehold.co/100x100/111/444?text=🎵" alt="Cover">
            </div>
            <div class="music-info-mini">
                <span class="music-label">AUDIO STREAM</span>
                <div id="musicTitle" class="music-title">Unknown Track</div>
                <a id="musicLink" class="music-link" href="#" target="_blank">SOURCE LINK</a>
            </div>
            <div id="toggleIcon" class="toggle-icon">▲</div>
        </div>
        <div class="music-controls">
            <button id="playPauseBtn" class="ctrl-btn">▶</button>
            <div class="vol-wrapper">
                <span class="vol-icon">VOL</span>
                <input type="range" id="volumeSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
        <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <footer class="footer-credit">POWERED BY FIVEMLIST</footer>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2; this.speedX = (Math.random() - 0.5) * 0.35;
                this.speedY = (Math.random() * -0.5) - 0.15; this.opacity = Math.random() * 0.7 + 0.2;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < (window.innerWidth * window.innerHeight) / 6000; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCYXQh5TD7Va9SbYjMUIIbtOv-2oIE7Ewg", authDomain: "westeros-5d84e.firebaseapp.com", projectId: "westeros-5d84e", storageBucket: "westeros-5d84e.firebasestorage.app", messagingSenderId: "874022183091", appId: "1:874022183091:web:8524830d8f2ebc64e790c6" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        let isPlaying = false; audio.volume = 0.5;

        if (sessionStorage.getItem('musicCurrentTime')) audio.currentTime = parseFloat(sessionStorage.getItem('musicCurrentTime'));
        if (sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; sessionStorage.setItem('musicIsPlaying', 'true'); }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { audio.pause(); playPauseBtn.innerHTML = '▶'; musicWidget.classList.remove('playing'); sessionStorage.setItem('musicIsPlaying', 'false'); }
            else { audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); sessionStorage.setItem('musicIsPlaying', 'true'); }).catch(e=>{}); }
            isPlaying = !isPlaying;
        });
        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                if (cfg.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${cfg.bgUrl}')`;
                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.mainTitle) document.getElementById('dynMainTitle').innerText = cfg.mainTitle;
                if (cfg.subTitle) document.getElementById('dynSubTitle').innerText = cfg.subTitle;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;
            }
        });
    </script>
</body>
</html>
