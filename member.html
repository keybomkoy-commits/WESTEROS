<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESTEROS</title>
    <!-- Favicon เปลี่ยนแปลงได้ผ่าน Admin แบบ Real-time -->
    <link rel="icon" id="siteFavicon" href="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030305; --gold: #d4af37; --red: #ff3344; --white: #ffffff; 
            /* ปรับพื้นหลังการ์ดให้เข้มขึ้นและทึบขึ้นเพื่อไม่ให้กลืนกับแบ็คกราวด์หลัก */
            --card-bg: rgba(8, 8, 12, 0.92);
        }
        @keyframes pageFadeIn { 0% { opacity: 0; filter: blur(10px); transform: scale(1.03); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }
        body { margin: 0; padding: 0; min-height: 100vh; width: 100vw; font-family: 'Inter', sans-serif; background-color: var(--bg-deep); color: #ffffff; overflow-x: hidden; display: flex; flex-direction: column; animation: pageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        #bg-image { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center; z-index: 0; }
        .bg-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 3, 5, 0.85); z-index: 1; pointer-events: none; }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        .container { position: relative; z-index: 3; max-width: 1200px; margin: 0 auto; padding: 40px 20px 140px; width: 100%; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 30px; }
        .btn-back { text-decoration: none; color: #aaa; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 10px 20px; border: 1px solid rgba(212,175,55,0.25); border-radius: 20px; background: rgba(10, 10, 15, 0.6); backdrop-filter: blur(10px); transition: all 0.35s; display: flex; align-items: center; gap: 8px; }
        .btn-back:hover { background: rgba(25, 20, 35, 0.9); color: #d4af37; border-color: #d4af37; transform: translateY(-3px); }
        .member-counter { font-size: 0.7rem; color: #aaa; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; background: rgba(10, 10, 15, 0.6); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); }
        .header-title-box { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 35px; }
        .page-title { font-family: 'Oswald', sans-serif; font-size: clamp(2.2rem, 5vw, 4rem); letter-spacing: 0.25em; margin: 0; font-weight: 700; text-transform: uppercase; color: #fff; text-shadow: 0 0 35px rgba(255, 255, 255, 0.3); }
        .page-subtitle { font-size: 0.6rem; color: #d4af37; letter-spacing: 0.4em; margin-top: 8px; text-transform: uppercase; font-weight: 600; }
        .search-container { width: 100%; margin-bottom: 55px; display: flex; justify-content: center; }
        .search-box { width: 100%; max-width: 580px; position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 20px; width: 15px; height: 15px; fill: #777; pointer-events: none; }
        .search-box input { width: 100%; padding: 16px 110px 16px 50px; box-sizing: border-box; background: rgba(12, 12, 18, 0.8); border: 1px solid rgba(212,175,55,0.25); border-radius: 30px; color: #fff; font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none; backdrop-filter: blur(15px); letter-spacing: 0.15em; text-transform: uppercase; transition: 0.3s; }
        .search-box input:focus { border-color: #d4af37; box-shadow: 0 0 30px rgba(212,175,55,0.3); }
        .search-btn { position: absolute; right: 5px; background: linear-gradient(135deg, #d4af37, #9a7b2c); color: #000; border: none; padding: 11px 22px; border-radius: 25px; font-family: 'Oswald', sans-serif; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .category-section { width: 100%; margin-bottom: 45px; display: none; }
        .category-section.has-data { display: block; animation: fadeInGroup 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInGroup { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .category-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .category-line { flex: 1; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.35), transparent); }
        .category-title { font-family: 'Oswald', sans-serif; font-size: 1.25rem; letter-spacing: 0.3em; margin: 0; text-transform: uppercase; font-weight: 700; }
        .title-gold { color: var(--gold); } .title-red { color: var(--red); } .title-white { color: var(--white); }
        .cat-badge-count { font-size: 0.65rem; background: rgba(255,255,255,0.07); padding: 3px 10px; border-radius: 12px; color: #ccc; }
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 18px; justify-content: center; width: 100%; }
        
        /* สไตล์การ์ดสมาชิก พื้นหลังเข้มขึ้น ตัดขอบชัดเจน พร้อมเงาลอยตัว */
        .member-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(18px); 
            border-radius: 14px; 
            padding: 16px 20px; 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); 
        }
        .card-gold { border-left: 4px solid var(--gold); } 
        .card-gold:hover { background: rgba(18, 18, 26, 0.98); border-color: rgba(212, 175, 55, 0.8); transform: translateY(-5px); box-shadow: 0 15px 45px rgba(212,175,55,0.3); }
        
        .card-red { border-left: 4px solid var(--red); } 
        .card-red:hover { background: rgba(18, 18, 26, 0.98); border-color: rgba(255, 51, 68, 0.8); transform: translateY(-5px); box-shadow: 0 15px 45px rgba(255,51,68,0.3); }
        
        .card-white { border-left: 4px solid var(--white); } 
        .card-white:hover { background: rgba(18, 18, 26, 0.98); border-color: rgba(255, 255, 255, 0.8); transform: translateY(-5px); box-shadow: 0 15px 45px rgba(255,255,255,0.3); }

        .member-avatar { width: 58px; height: 58px; border-radius: 11px; background-color: #1a1a24; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
        .member-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .member-name { font-size: 1rem; font-weight: 700; margin: 0 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Oswald', sans-serif; color: #fff; }
        .role-tag { display: inline-block; font-size: 0.55rem; padding: 2px 9px; border-radius: 6px; text-transform: uppercase; font-weight: 700; width: fit-content; }
        .tag-gold { background: rgba(212,175,55,0.18); color: var(--gold); } .tag-red { background: rgba(255,51,68,0.18); color: var(--red); } .tag-white { background: rgba(255,255,255,0.12); color: var(--white); }
        .fb-btn { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s; flex-shrink: 0; }
        .btn-gold-fb { background: rgba(212,175,55,0.12); color: var(--gold); } .btn-gold-fb:hover { background: var(--gold); color: #000; }
        .btn-red-fb { background: rgba(255,51,68,0.12); color: var(--red); } .btn-red-fb:hover { background: var(--red); color: #fff; }
        .btn-white-fb { background: rgba(255,255,255,0.08); color: var(--white); } .btn-white-fb:hover { background: var(--white); color: #000; }
        .no-results { text-align: center; color: #777; padding: 40px; font-size: 0.85rem; display: none; text-transform: uppercase; }

        .music-widget { position: fixed; bottom: 25px; right: 25px; background: rgba(10, 10, 15, 0.88); backdrop-filter: blur(25px); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 14px; width: 280px; z-index: 99999; transition: all 0.6s; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .music-widget.collapsed { height: 60px; } .music-widget.expanded { height: 115px; }
        .music-header { display: flex; align-items: center; padding: 9px 12px; height: 60px; cursor: pointer; }
        .cover-wrapper { position: relative; width: 36px; height: 36px; margin-right: 10px; flex-shrink: 0; }
        .music-cover { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(212, 175, 55, 0.6); animation: spinRecord 5s linear infinite; animation-play-state: paused; }
        .playing .music-cover { animation-play-state: running; }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }
        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.42rem; color: #d4af37; font-weight: 700; }
        .music-title { font-family: 'Oswald', sans-serif; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .music-link { font-size: 0.45rem; color: #888; text-decoration: none; }
        .toggle-icon { font-size: 0.5rem; color: #d4af37; padding: 4px; transition: 0.5s; }
        .music-controls { display: flex; align-items: center; padding: 0 14px 12px 14px; gap: 12px; opacity: 0; transition: opacity 0.4s; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.4); }
        .music-widget.expanded .music-controls { opacity: 1; }
        .ctrl-btn { background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.4); color: #d4af37; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); padding: 3px 8px; border-radius: 6px; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 3px; background: rgba(255,255,255,0.2); outline: none; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; background: #d4af37; cursor: pointer; }

        .footer-credit { position: relative; z-index: 3; width: 100%; text-align: center; padding: 20px 0; font-size: 0.55rem; color: #777; letter-spacing: 0.35em; text-transform: uppercase; font-weight: 600; margin-top: auto; }
        .secret-admin-link { color: #777; text-decoration: none; transition: 0.3s; }
        .secret-admin-link:hover { color: var(--gold); }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="btn-back"><span>‹</span> BACK</a>
            <div id="totalMembersBadge" class="member-counter">0 MEMBERS</div>
        </div>
        <div class="header-title-box">
            <h1 id="dynMemberTitle" class="page-title">WESTEROS</h1>
            <div id="dynMemberSubTitle" class="page-subtitle">MEMBER WESTEROS</div>
        </div>
        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.71 20.29l-5.005-5.005C17.79 13.785 18.5 11.977 18.5 10c0-4.694-4.306-8.5-9.5-8.5S-0.5 5.306-0.5 10s4.306 8.5 9.5 8.5c1.977 0 3.785-.71 5.285-1.795l5.005 5.005c.39.39 1.024.39 1.414 0 .39-.39.39-1.024 0-1.414zM9 16c-3.314 0-6-2.686-6-6s2.686-6 6-6 6 2.686 6 6-2.686 6-6 6z"/></svg>
                <input type="text" id="searchInput" placeholder="Search members..." autocomplete="off">
                <button class="search-btn" id="searchBtn">SEARCH</button>
            </div>
        </div>
        <div id="noResults" class="no-results">-- NO MEMBERS FOUND --</div>
        <div id="categoryContainer" style="width: 100%;"></div>
    </div>

    <div id="musicWidget" class="music-widget collapsed">
        <div class="music-header" id="toggleMusicBtn">
            <div class="cover-wrapper">
                <img id="musicCover" class="music-cover" src="https://placehold.co/100x100/111/444?text=🎵" alt="Cover">
            </div>
            <div class="music-info-mini">
                <span class="music-label">AUDIO STREAM</span>
                <div id="musicTitle" class="music-title">Unknown Track</div>
                <a id="musicLink" class="music-link" href="#" target="_blank">SOURCE LINK</a>
            </div>
            <div id="toggleIcon" class="toggle-icon">▲</div>
        </div>
        <div class="music-controls">
            <button id="playPauseBtn" class="ctrl-btn">▶</button>
            <div class="vol-wrapper">
                <span class="vol-icon">VOL</span>
                <input type="range" id="volumeSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
        <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <footer class="footer-credit">
        SYSTEM DESIGN BY QA QEN <span style="opacity: 0.3; margin: 0 8px;">|</span> <a href="admin.html" class="secret-admin-link">PANEL</a>
    </footer>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2; this.speedX = (Math.random() - 0.5) * 0.35;
                this.speedY = (Math.random() * -0.5) - 0.15; this.opacity = Math.random() * 0.7 + 0.2;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < (window.innerWidth * window.innerHeight) / 6000; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCYXQh5TD7Va9SbYjMUIIbtOv-2oIE7Ewg", authDomain: "westeros-5d84e.firebaseapp.com", projectId: "westeros-5d84e", storageBucket: "westeros-5d84e.firebasestorage.app", messagingSenderId: "874022183091", appId: "1:874022183091:web:8524830d8f2ebc64e790c6" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const categoriesConfig = [
            { id: 'found', name: 'FOUNDERS', titleClass: 'title-gold', cardClass: 'card-gold', tagClass: 'tag-gold', btnClass: 'btn-gold-fb', roleKey: 'FOUNDERS' },
            { id: 'lead', name: 'LEADERS', titleClass: 'title-red', cardClass: 'card-red', tagClass: 'tag-red', btnClass: 'btn-red-fb', roleKey: 'LEADERS' },
            { id: 'memb', name: 'MEMBERS', titleClass: 'title-white', cardClass: 'card-white', tagClass: 'tag-white', btnClass: 'btn-white-fb', roleKey: 'MEMBERS' }
        ];

        let membersData = [];
        let globalDefaultAvatar = 'https://placehold.co/150/151520/d4af37?text=UOF';

        const container = document.getElementById('categoryContainer');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const totalMembersBadge = document.getElementById('totalMembersBadge');

        function initCategoryContainers() {
            container.innerHTML = '';
            categoriesConfig.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = `section-${cat.id}`;
                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-line"></div>
                        <h2 class="category-title ${cat.titleClass}">${cat.name} <span class="cat-badge-count" id="count-${cat.id}">00</span></h2>
                        <div class="category-line"></div>
                    </div>
                    <div class="member-grid" id="grid-${cat.id}"></div>
                `;
                container.appendChild(section);
            });
        }

        function renderMembers(dataToRender, searchTerm = "") {
            categoriesConfig.forEach(cat => {
                document.getElementById(`grid-${cat.id}`).innerHTML = '';
                document.getElementById(`section-${cat.id}`).classList.remove('has-data');
            });

            const filteredData = dataToRender.filter(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()));
            noResults.style.display = filteredData.length === 0 ? 'block' : 'none';
            totalMembersBadge.innerText = `${filteredData.length} MEMBERS`;

            categoriesConfig.forEach(cat => {
                const groupList = filteredData.filter(m => m.role.toUpperCase() === cat.roleKey.toUpperCase());
                if (groupList.length > 0) {
                    const grid = document.getElementById(`grid-${cat.id}`);
                    const section = document.getElementById(`section-${cat.id}`);
                    document.getElementById(`count-${cat.id}`).innerText = groupList.length < 10 ? `0${groupList.length}` : groupList.length;

                    groupList.forEach(member => {
                        const card = document.createElement('div');
                        card.className = `member-card ${cat.cardClass}`;
                        const avatarUrl = (member.avatar && member.avatar.trim() !== "") ? member.avatar : globalDefaultAvatar;
                        card.innerHTML = `
                            <img src="${avatarUrl}" class="member-avatar" alt="${member.name}">
                            <div class="member-info">
                                <h3 class="member-name" title="${member.name}">${member.name}</h3>
                                <span class="role-tag ${cat.tagClass}">${member.role}</span>
                            </div>
                            <a href="${member.facebookUrl || '#'}" target="_blank" class="fb-btn ${cat.btnClass}" title="Facebook Profile">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                    section.classList.add('has-data');
                }
            });
        }

        initCategoryContainers();

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        let isPlaying = false; audio.volume = 0.5;

        if (sessionStorage.getItem('musicCurrentTime')) audio.currentTime = parseFloat(sessionStorage.getItem('musicCurrentTime'));
        if (sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; sessionStorage.setItem('musicIsPlaying', 'true'); }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { audio.pause(); playPauseBtn.innerHTML = '▶'; musicWidget.classList.remove('playing'); sessionStorage.setItem('musicIsPlaying', 'false'); }
            else { audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); sessionStorage.setItem('musicIsPlaying', 'true'); }).catch(e=>{}); }
            isPlaying = !isPlaying;
        });
        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const config = docSnap.data();
                if (config.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${config.bgUrl}')`;
                if (config.faviconUrl) document.getElementById('siteFavicon').href = config.faviconUrl;
                if (config.memberTitle) document.getElementById('dynMemberTitle').innerText = config.memberTitle;
                if (config.memberSubTitle) document.getElementById('dynMemberSubTitle').innerText = config.memberSubTitle;
                if (config.defaultAvatar) globalDefaultAvatar = config.defaultAvatar;
                if (config.musicTitle) document.getElementById('musicTitle').innerText = config.musicTitle;
                if (config.musicLinkText) document.getElementById('musicLink').innerText = config.musicLinkText;
                if (config.musicLinkUrl) document.getElementById('musicLink').href = config.musicLinkUrl;
                if (config.musicCoverUrl) document.getElementById('musicCover').src = config.musicCoverUrl;
            }
        });

        onSnapshot(collection(db, "members"), (snapshot) => {
            let firebaseMembers = [];
            snapshot.forEach(doc => { firebaseMembers.push({ id: doc.id, ...doc.data() }); });
            membersData = firebaseMembers.length > 0 ? firebaseMembers : [

            ];
            renderMembers(membersData, searchInput.value);
        });

        searchInput.addEventListener('input', (e) => { renderMembers(membersData, e.target.value); });
        document.getElementById('searchBtn').addEventListener('click', () => { renderMembers(membersData, searchInput.value); });
    </script>
</body>
</html>
